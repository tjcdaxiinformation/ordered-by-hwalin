<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>崇德教會購地募款義賣認購系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Firebase 11 ES Module 載入 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.FirebaseSDK = {
      initializeApp,
      getAuth,
      signInWithCustomToken,
      signInAnonymously,
      onAuthStateChanged,
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot
    };
  </script>
</head>
<body class="bg-amber-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 內建 SVG 圖示元件
    const ChurchIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v3m0 0l-3 3h6l-3-3zm-6 6h12v11H6V9zm3 4h2v3H9v-3zm4 0h2v3h-2v-3z"/></svg>
    );
    const ShoppingBagIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
    );
    const FlameIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
    );
    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
    );
    const Share2Icon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
    );
    const Trash2Icon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    );
    const PlusIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
    );
    const MinusIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 12H6"/></svg>
    );
    const ClockIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const SendIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    );
    const CloudIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 001-9.9M13 5a5 5 0 00-4.9 4.1 4 4 0 00-5.1 5.9"/></svg>
    );

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'chongde-church-order-app';

    function App() {
      const [orders, setOrders] = useState([]);
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // 表單狀態
      const [name, setName] = useState('');
      const [peelQty, setPeelQty] = useState(0);
      const [makauyQty, setMakauyQty] = useState(0);
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      // 刪除確認 Modal 狀態
      const [deleteModalTarget, setDeleteModalTarget] = useState(null);

      const PEEL_PRICE = 150;
      const MAKAUY_PRICE = 200;

      // 1. 初始化 Firebase 與 身份驗證
      useEffect(() => {
        let unsubscribeAuth = () => {};

        const initFirebase = async () => {
          if (typeof __firebase_config !== 'undefined' && window.FirebaseSDK) {
            try {
              const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.FirebaseSDK;
              const config = JSON.parse(__firebase_config);
              const app = initializeApp(config);
              const auth = getAuth(app);

              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }

              unsubscribeAuth = onAuthStateChanged(auth, (u) => {
                setUser(u);
              });
            } catch (err) {
              console.error("Firebase auth error:", err);
              setLoading(false);
            }
          } else {
            // 本地快取備援 (若無 Firebase 環境時)
            try {
              const localData = localStorage.getItem('chongde_orders_backup');
              if (localData) setOrders(JSON.parse(localData));
            } catch (e) {}
            setLoading(false);
          }
        };

        initFirebase();
        return () => unsubscribeAuth();
      }, []);

      // 2. 訂閱 Firestore 實時資料庫（隨時保持最新同步）
      useEffect(() => {
        if (!user || typeof __firebase_config === 'undefined' || !window.FirebaseSDK) return;

        const { getFirestore, collection, onSnapshot, getAuth } = window.FirebaseSDK;
        const auth = getAuth();
        const db = getFirestore();
        
        // 使用嚴格規範路徑: /artifacts/{appId}/public/data/orders
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');

        const unsubscribe = onSnapshot(
          ordersCol,
          (snapshot) => {
            const fetchedList = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));

            // 依時間由新到舊排序 (在 JS 記憶體中排序)
            fetchedList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setOrders(fetchedList);
            setLoading(false);
          },
          (error) => {
            console.error("Firestore onSnapshot error:", error);
            showToast("雲端同步發生錯誤");
            setLoading(false);
          }
        );

        return () => unsubscribe();
      }, [user]);

      // 計算統計
      const totalPeelCount = orders.reduce((sum, o) => sum + (Number(o.peelQty) || 0), 0);
      const totalMakauyCount = orders.reduce((sum, o) => sum + (Number(o.makauyQty) || 0), 0);
      const grandTotalJars = totalPeelCount + totalMakauyCount;
      const grandTotalAmount = orders.reduce((sum, o) => sum + (Number(o.totalAmount) || 0), 0);

      const currentTotalAmount = (peelQty * PEEL_PRICE) + (makauyQty * MAKAUY_PRICE);
      const currentTotalJars = peelQty + makauyQty;

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      // 提交新訂單至雲端
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim()) return showToast('⚠️ 請輸入認購人姓名！');
        if (peelQty === 0 && makauyQty === 0) return showToast('⚠️ 請至少選擇一種辣椒的數量！');

        setIsSubmitting(true);

        const now = new Date();
        const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newOrderData = {
          name: name.trim(),
          peelQty: Number(peelQty),
          makauyQty: Number(makauyQty),
          totalAmount: currentTotalAmount,
          timestamp: formattedDate,
          createdAt: Date.now(),
          notes: '到貨教會取件',
          uid: user ? user.uid : 'anon'
        };

        if (user && window.FirebaseSDK) {
          try {
            const { getFirestore, collection, addDoc } = window.FirebaseSDK;
            const db = getFirestore();
            const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            await addDoc(ordersCol, newOrderData);
            showToast('🎉 登記已同步上傳雲端！感謝您的愛心！');
          } catch (err) {
            console.error("Error adding doc:", err);
            showToast('⚠️ 上傳失敗，請重試');
          }
        } else {
          // 本地備援
          const fallbackList = [{ id: Date.now().toString(), ...newOrderData }, ...orders];
          setOrders(fallbackList);
          try { localStorage.setItem('chongde_orders_backup', JSON.stringify(fallbackList)); } catch (e) {}
          showToast('🎉 登記成功！');
        }

        setName('');
        setPeelQty(0);
        setMakauyQty(0);
        setIsSubmitting(false);
      };

      // 執行刪除
      const confirmDelete = async () => {
        if (!deleteModalTarget) return;
        const targetId = deleteModalTarget.id;
        setDeleteModalTarget(null);

        if (user && window.FirebaseSDK) {
          try {
            const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
            const db = getFirestore();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', targetId);
            await deleteDoc(docRef);
            showToast('已從雲端刪除該筆紀錄');
          } catch (err) {
            console.error("Error deleting doc:", err);
            showToast('刪除失敗');
          }
        } else {
          const updated = orders.filter(o => o.id !== targetId);
          setOrders(updated);
          try { localStorage.setItem('chongde_orders_backup', JSON.stringify(updated)); } catch (e) {}
          showToast('已刪除紀錄');
        }
      };

      const handleCopySummary = () => {
        const text = `【崇德教會購地募款義賣 認購即時統計】\n` +
          `----------------------------\n` +
          `🔥 剝皮辣椒 (150元/罐)：${totalPeelCount} 罐\n` +
          `🌿 馬告辣椒 (200元/罐)：${totalMakauyCount} 罐\n` +
          `🏆 總認購數量：${grandTotalJars} 罐\n` +
          `💰 募款總金額：NT$ ${grandTotalAmount.toLocaleString()} 元\n` +
          `👥 總登記人數：${orders.length} 人\n` +
          `----------------------------\n` +
          `🚚 取件方式：到貨教會取件\n` +
          `⏰ 加購登記截止：7月31日止\n` +
          `感謝各位弟兄姊妹的同心響應！願神紀念大家的愛心 ❤️`;

        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => showToast('📋 已複製統計摘要至剪貼簿！'));
        } else {
          showToast('📋 已產生統計摘要');
        }
      };

      const filteredOrders = orders.filter(o => 
        o.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="min-h-screen bg-gradient-to-b from-amber-50 via-orange-50 to-red-50 text-slate-800 font-sans pb-16">
          
          {/* Toast 提示條 */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-stone-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center space-x-2 border border-amber-400/30">
              <SparklesIcon className="w-5 h-5 text-amber-400 shrink-0" />
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* 刪除確認 Modal */}
          {deleteModalTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-red-100 text-center space-y-4">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <Trash2Icon className="w-6 h-6" />
                </div>
                <div>
                  <h4 className="font-extrabold text-slate-800 text-lg">確定要刪除此筆紀錄？</h4>
                  <p className="text-xs text-slate-500 mt-1">
                    認購人：<span className="font-bold text-slate-700">{deleteModalTarget.name}</span>
                  </p>
                </div>
                <div className="flex space-x-3 pt-2">
                  <button
                    onClick={() => setDeleteModalTarget(null)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                  >
                    取消
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm"
                  >
                    確認刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 頁首 Header */}
          <header className="bg-gradient-to-r from-red-800 via-red-700 to-rose-900 text-white shadow-xl relative overflow-hidden">
            <div className="max-w-5xl mx-auto px-4 py-8 md:py-12 relative z-10 text-center">
              
              <div className="inline-flex items-center space-x-2 bg-red-900/60 backdrop-blur border border-amber-300/40 text-amber-200 text-xs md:text-sm px-4 py-1.5 rounded-full mb-4">
                <ChurchIcon className="w-4 h-4" />
                <span>主內一家 共建神家 ｜ 真耶穌教會</span>
                <span className="bg-emerald-500/20 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 border border-emerald-400/30">
                  <CloudIcon className="w-3 h-3" /> 雲端實時同步中
                </span>
              </div>

              <h1 className="text-2xl md:text-5xl font-black text-amber-100 mb-2">
                大溪教會訪問 崇德教會花東之旅
              </h1>
              <p className="text-lg md:text-3xl font-extrabold text-red-200 mb-4">
                崇德教會 購地募款基金義賣
              </p>

              <div className="mt-4 max-w-xl mx-auto bg-amber-50/10 backdrop-blur-md rounded-2xl p-4 border border-amber-200/20 text-left text-xs md:text-sm text-amber-100">
                <p className="italic leading-relaxed">
                  看哪，弟兄和睦同居，是何等的善，何等的美！這好比那貴重的油澆在亞倫的頭上，流到鬍鬚，又流到衣襟；又好比黑門的甘露降在錫安山；因為在那裡有耶和華所命定的福，就是永遠的生命。
                </p>
                <div className="text-right font-semibold text-amber-300 mt-2">— 詩篇 133 篇 1-3 節</div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 -mt-6 relative z-20 space-y-8">

            {/* 🌟 巨型統計看板 (大字顯眼) */}
            <section className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 border-4 border-amber-400 relative overflow-hidden">
              <div className="text-center mb-6">
                <span className="text-xs md:text-sm font-bold text-red-700 bg-red-100 px-3 py-1 rounded-full inline-block mb-1">
                  建堂義賣 認購累計
                </span>
                <h2 className="text-2xl md:text-3xl font-black text-slate-800">全會總認購統計</h2>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                
                {/* 總認購罐數 (超大字) */}
                <div className="bg-gradient-to-br from-red-600 to-rose-700 text-white rounded-2xl p-6 text-center shadow-lg">
                  <p className="text-amber-200 font-bold text-base md:text-lg mb-1">【 認購總數量 】</p>
                  <div className="my-1 flex items-baseline justify-center gap-2">
                    <span className="text-6xl sm:text-7xl md:text-8xl font-black text-amber-300 drop-shadow">
                      {loading ? '...' : grandTotalJars}
                    </span>
                    <span className="text-2xl font-bold text-amber-100">罐</span>
                  </div>
                  <p className="text-xs md:text-sm text-red-100 mt-1">
                    感謝共有 <span className="font-bold text-white underline">{orders.length}</span> 位弟兄姊妹響應
                  </p>
                </div>

                {/* 總金額 */}
                <div className="bg-gradient-to-br from-amber-500 to-amber-600 text-white rounded-2xl p-6 text-center shadow-lg">
                  <p className="text-amber-100 font-bold text-base md:text-lg mb-1">【 義賣募款總金額 】</p>
                  <div className="my-1 flex items-baseline justify-center gap-1">
                    <span className="text-xl md:text-3xl font-black text-amber-200">NT$</span>
                    <span className="text-5xl sm:text-6xl md:text-7xl font-black drop-shadow">
                      {loading ? '...' : grandTotalAmount.toLocaleString()}
                    </span>
                  </div>
                  <p className="text-xs md:text-sm text-amber-100 mt-1">
                    所得款項全數支持崇德教會購地基金 ❤️
                  </p>
                </div>

              </div>

              <div className="grid grid-cols-2 gap-3 bg-orange-50 p-4 rounded-xl border border-orange-200">
                <div className="bg-white p-3 rounded-xl border border-red-100 text-center">
                  <div className="flex items-center justify-center space-x-1 text-red-700 font-bold text-xs md:text-sm mb-1">
                    <FlameIcon className="w-4 h-4 text-red-500" />
                    <span>剝皮辣椒總數</span>
                  </div>
                  <div className="text-2xl md:text-4xl font-extrabold text-red-600">
                    {totalPeelCount} <span className="text-xs font-normal text-slate-500">罐</span>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-0.5">NT$ 150/罐</div>
                </div>

                <div className="bg-white p-3 rounded-xl border border-amber-100 text-center">
                  <div className="flex items-center justify-center space-x-1 text-amber-800 font-bold text-xs md:text-sm mb-1">
                    <SparklesIcon className="w-4 h-4 text-amber-500" />
                    <span>馬告辣椒總數</span>
                  </div>
                  <div className="text-2xl md:text-4xl font-extrabold text-amber-700">
                    {totalMakauyCount} <span className="text-xs font-normal text-slate-500">罐</span>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-0.5">NT$ 200/罐</div>
                </div>
              </div>

              <div className="mt-5 flex flex-col md:flex-row items-center justify-between gap-3 pt-3 border-t text-xs md:text-sm text-slate-600">
                <div className="flex items-center space-x-2 text-red-700 font-semibold bg-red-50 px-3 py-1.5 rounded-lg">
                  <ClockIcon className="w-4 h-4 shrink-0" />
                  <span>重要提醒：加購數量將於 <b>7/31 截止登記</b>，新鮮配送至教會！</span>
                </div>
                
                <button
                  onClick={handleCopySummary}
                  className="w-full md:w-auto flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs"
                >
                  <Share2Icon className="w-3.5 h-3.5" />
                  <span>複製 LINE 統計摘要</span>
                </button>
              </div>
            </section>

            {/* 表單與即時名單 */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* 精簡表單 */}
              <div className="lg:col-span-5 space-y-6">
                <div className="bg-white rounded-3xl shadow-xl p-6 border border-amber-200">
                  <div className="flex items-center space-x-3 pb-4 mb-5 border-b">
                    <div className="p-2.5 bg-red-100 text-red-700 rounded-2xl">
                      <ShoppingBagIcon className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-black text-slate-800">花蓮手工辣椒認購</h3>
                      <p className="text-xs text-slate-500">填寫姓名與數量，自動同步至雲端</p>
                    </div>
                  </div>

                  <form onSubmit={handleSubmit} className="space-y-4">
                    {/* 剝皮辣椒 */}
                    <div className="p-4 rounded-2xl bg-red-50 border border-red-200 space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">經典人氣</span>
                          <h4 className="font-extrabold text-slate-800 text-base">剝皮辣椒</h4>
                        </div>
                        <div className="text-right">
                          <span className="text-xl font-black text-red-600">NT$ 150</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-2 border-t border-red-200/50">
                        <span className="text-xs font-bold">購買數量：</span>
                        <div className="flex items-center space-x-2">
                          <button
                            type="button"
                            onClick={() => setPeelQty(Math.max(0, peelQty - 1))}
                            className="w-8 h-8 rounded-lg bg-white border flex items-center justify-center font-bold active:scale-95 transition"
                          >
                            <MinusIcon className="w-4 h-4" />
                          </button>
                          <input
                            type="number"
                            min="0"
                            value={peelQty}
                            onChange={(e) => setPeelQty(Math.max(0, parseInt(e.target.value) || 0))}
                            className="w-14 text-center font-black text-lg bg-white border rounded-lg py-1"
                          />
                          <button
                            type="button"
                            onClick={() => setPeelQty(peelQty + 1)}
                            className="w-8 h-8 rounded-lg bg-red-600 text-white flex items-center justify-center font-bold active:scale-95 transition"
                          >
                            <PlusIcon className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* 馬告辣椒 */}
                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="bg-amber-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">原鄉風味</span>
                          <h4 className="font-extrabold text-slate-800 text-base">馬告辣椒</h4>
                        </div>
                        <div className="text-right">
                          <span className="text-xl font-black text-amber-700">NT$ 200</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-2 border-t border-amber-200/50">
                        <span className="text-xs font-bold">購買數量：</span>
                        <div className="flex items-center space-x-2">
                          <button
                            type="button"
                            onClick={() => setMakauyQty(Math.max(0, makauyQty - 1))}
                            className="w-8 h-8 rounded-lg bg-white border flex items-center justify-center font-bold active:scale-95 transition"
                          >
                            <MinusIcon className="w-4 h-4" />
                          </button>
                          <input
                            type="number"
                            min="0"
                            value={makauyQty}
                            onChange={(e) => setMakauyQty(Math.max(0, parseInt(e.target.value) || 0))}
                            className="w-14 text-center font-black text-lg bg-white border rounded-lg py-1"
                          />
                          <button
                            type="button"
                            onClick={() => setMakauyQty(makauyQty + 1)}
                            className="w-8 h-8 rounded-lg bg-amber-600 text-white flex items-center justify-center font-bold active:scale-95 transition"
                          >
                            <PlusIcon className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* 姓名輸入 */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">認購人姓名 *</label>
                      <input
                        type="text"
                        required
                        placeholder="請輸入姓名（例：王鴻志）"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-red-500"
                      />
                    </div>

                    {/* 統一取件說明標示 */}
                    <div className="bg-stone-100 border border-stone-300 text-stone-700 rounded-xl p-2.5 text-center text-xs font-bold">
                      🚚 取件方式：到貨教會付款取件
                    </div>

                    {/* 當前小計 */}
                    <div className="bg-amber-100/70 border border-amber-300 rounded-xl p-3 flex justify-between items-center">
                      <span className="text-xs font-bold text-amber-900">小計 ({currentTotalJars} 罐)：</span>
                      <span className="text-xl font-black text-red-700">NT$ {currentTotalAmount.toLocaleString()}</span>
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-base active:scale-98"
                    >
                      <SendIcon className="w-5 h-5" />
                      <span>{isSubmitting ? '儲存至雲端中...' : '確認送出認購登記'}</span>
                    </button>
                  </form>
                </div>
              </div>

              {/* 右側公開雲端名單 */}
              <div className="lg:col-span-7 space-y-4">
                <div className="bg-white rounded-3xl shadow-xl p-6 border border-slate-200">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b">
                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                      <span>認購登記名單 ({filteredOrders.length} 筆)</span>
                      <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                        雲端實時
                      </span>
                    </h3>
                    <input
                      type="text"
                      placeholder="搜尋姓名..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="px-3 py-1 bg-slate-100 border rounded-lg text-xs outline-none"
                    />
                  </div>

                  {loading ? (
                    <div className="text-center py-12 text-slate-400 text-xs">載入雲端資料中...</div>
                  ) : filteredOrders.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-xs">尚無登記資料</div>
                  ) : (
                    <div className="space-y-2 max-h-[500px] overflow-y-auto">
                      {filteredOrders.map(o => (
                        <div key={o.id} className="bg-slate-50 p-3 rounded-xl border flex justify-between items-center text-xs hover:bg-orange-50/40 transition">
                          <div>
                            <div className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                              <span>{o.name}</span>
                              <span className="text-[10px] bg-stone-200 text-stone-700 px-1.5 py-0.5 rounded font-normal">
                                到貨教會取件
                              </span>
                            </div>
                            <div className="text-slate-400 text-[10px] mt-0.5">{o.timestamp}</div>
                          </div>

                          <div className="flex items-center space-x-3">
                            <div className="text-right">
                              <div className="font-bold text-slate-700">
                                {o.peelQty > 0 && `剝皮:${o.peelQty} `}
                                {o.makauyQty > 0 && `馬告:${o.makauyQty}`}
                              </div>
                              <div className="font-black text-red-600 text-sm">NT$ {o.totalAmount}</div>
                            </div>
                            <button
                              onClick={() => setDeleteModalTarget(o)}
                              className="text-slate-300 hover:text-red-500 p-1"
                              title="刪除此筆"
                            >
                              <Trash2Icon className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
